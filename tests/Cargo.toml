[package]
name = "coinduction-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
coinduction = { path = ".." }
# `#[subcrate(::announce)]` in `common/mod.rs`
announce = "0.2.0"
subcrate = "0.1.3"
rustversion = "1.0"
trybuild = "1.0"

# Compiles the `#[subcrate]` modules of the tests
[build-dependencies]
subcrate = "0.1.3"

# The tests are the `*.rs` files here: the symlink `tests -> .` makes this directory Cargo's test
# directory (`<package>/tests/`), where Cargo and subcrate's build script find them.

# `build.rs` is the build script, not a test
[[test]]
name = "build"
path = "build.rs"
test = false
