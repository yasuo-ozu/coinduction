[package]
name = "coinduction"
version = "0.2.0"
edition = "2021"
rust-version = "1.71"
description = "Attribute macros for defining circular type references and recursive trait implementations in Rust"
license = "MIT"
repository = "https://github.com/yasuo-ozu/coinduction"
keywords = ["macro", "trait", "recursive", "circular", "zerocost"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
authors = ["yasuo-ozu"]
# `build.rs` compiles the `#[subcrate]` modules of the tests where the package is built
exclude = ["tests/"]

[dependencies]
coinduction-macro = { path = "./macro", version = "0.2.0" }
announce = "0.2.0"

[dev-dependencies]
rustversion = "1.0"
trybuild = "1.0"
subcrate = "0.1.3"

# Compiles the `#[subcrate]` modules of the tests
[build-dependencies]
subcrate = "0.1.3"

[lib]
path = "lib.rs"

[workspace]
members = ["macro", "."]
resolver = "2"
