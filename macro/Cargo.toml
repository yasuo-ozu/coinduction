[package]
name = "coinduction-macro"
version = "0.2.0"
edition = "2021"
rust-version = "1.71"
description = "Attribute macros for defining circular type references and recursive trait implementations in Rust"
license = "MIT"

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
proc-macro2 = "1.0"
proc-macro-error = { version = "1.0", default-features = false }
# `announce::helper`: the parser of what announce trampolines send to `__next_step`.
announce = "0.2.0"
template-quote = "0.4.0"
safegraph = { version = "0.1.0", default-features = false }

[dependencies.syn]
version = "2.0"
features = ["full", "derive", "printing", "extra-traits", "visit", "visit-mut"]
